<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmation</title>
  <link rel="stylesheet" href="confirmation.css" />
</head>
<body>
  <main class="receipt">
    <h2>Order Confirmation</h2>
    <p><strong>Name:</strong> <span id="conf-name"></span></p>
    <p><strong>Email:</strong> <span id="conf-email"></span></p>
    <p><strong>Phone:</strong> <span id="conf-phone"></span></p>
    <p><strong>Address:</strong> <span id="conf-address"></span></p>

    <table id="order-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Total: <span id="conf-total"></span></h3>

    <div class="send-email-btn">
      <button id="sendEmailBtn">Send Receipt to Email</button>
    </div>
  </main>

  <!-- Loader -->
  <div id="loader" class="loader-overlay" style="display: none;">
    <div class="loader-content">
      <div class="spinner"></div>
      <p>Sending receipt...</p>
    </div>
  </div>

  <script src="confirmation.js"></script>
</body>
</html>
