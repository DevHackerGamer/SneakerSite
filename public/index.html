<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sneaker Store - Home</title>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <nav>
    <div class="nav-container">
      <h2 class="logo">Big Dawg Sneakers</h2>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <h2>🔥 Special Offers</h2>
    <div id="featured-items" class="products-row"></div>
  </main>

  <script>
    fetch('sneakers.json')
      .then(res => res.json())
      .then(data => {
        const specials = data.filter(item => item.special === true);
        const container = document.getElementById('featured-items');

        specials.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${product.image}" alt="${product.name}" />
            <h3>${product.name}</h3>
            <p>$${product.price.toFixed(2)}</p>
          `;
            const button = document.createElement('button');
            button.textContent = 'Add to Cart';
            button.addEventListener('click', () => addToCart(product));
            card.appendChild(button);
          container.appendChild(card);
        });
      });

    function addToCart(product) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];

      const index = cart.findIndex(item => item.id === product.id);

      if (index !== -1) {
        cart[index].qty += 1; // Increment quantity if product exists
      } else {
        cart.push({ ...product, qty: 1 }); // Add new product with qty = 1
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${product.name} added to cart!`);
      updateCartCount(); // optional, if you want to update cart icon count
    }

    function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById('cart-count').textContent = count;
    }
  </script>

  <div id="cart-icon">
    <i class="fa-solid fa-cart-shopping"></i>
    <span id="cart-count">0</span>
  </div>

  <footer>
    <p>&copy; 2025 Big Dawg Sneakers. All rights reserved.</p>
  </footer>
</body>
</html>
