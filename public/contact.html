<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Big Dawg Sneakers</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

<nav>
  <div class="nav-container">
    <a href="index.html"><h2 class="logo">Big Dawg Sneakers</h2></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <h1>Contact Us</h1>
  <form id="contact-form">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required />

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <!-- Hidden fields -->
    <input type="text" name="_gotcha" style="display:none" />
    <input type="hidden" id="time" name="time" />

    <button type="submit" aria-label="Send message to Big Dawg Sneakers support">Send Message</button>
  </form>

  <p id="form-status" style="margin-top: 1em;"></p>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>
</div>

<footer>
  &copy; 2025 Big Dawg Sneakers. All rights reserved.
</footer>

<!-- Load EmailJS SDK first, then contact.js after it’s ready -->
<script>
  const sdkScript = document.createElement("script");
  sdkScript.src = "https://cdn.emailjs.com/sdk/3.2/email.min.js";
  sdkScript.onload = () => {
    const contactScript = document.createElement("script");
    contactScript.src = "contact.js";
    document.body.appendChild(contactScript);
  };
  document.head.appendChild(sdkScript);
</script>

</body>
</html>
